<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบสมาชิก</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #001e2b;
      --ink-soft: #3d4f58;
      --green: #00684a;
      --green-bright: #00ed64;
      --mint: #e3fcf7;
      --bg: #f4f7f6;
      --panel: #ffffff;
      --line: #dbe3e0;
      --danger: #b42318;
      --danger-bg: #fef3f2;
      --ok-bg: #e3fcf7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }

    /* ส่วนหัว */
    header {
      background: var(--ink);
      color: #fff;
      padding: 2.5rem 1.5rem 4.5rem;
    }
    .wrap { max-width: 1040px; margin: 0 auto; }
    header h1 {
      margin: 0 0 .25rem;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    header h1::before {
      content: "";
      display: inline-block;
      width: .7rem; height: .7rem;
      border-radius: 50%;
      background: var(--green-bright);
      margin-right: .6rem;
      vertical-align: middle;
    }
    header p { margin: 0; color: #a8bcc4; }

    main {
      max-width: 1040px;
      margin: -2.75rem auto 3rem;
      padding: 0 1.5rem;
    }

    /* ข้อความแจ้งผล */
    #message {
      margin: 0 0 1rem;
      padding: .75rem 1rem;
      border-radius: 10px;
      font-weight: 500;
      border: 1px solid transparent;
    }
    #message:empty { display: none; }
    #message.success { background: var(--ok-bg); color: var(--green); border-color: #a7e8d6; }
    #message.error { background: var(--danger-bg); color: var(--danger); border-color: #f5c2bd; }

    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: 0 6px 20px rgba(0, 30, 43, .06);
    }
    .forms { display: grid; gap: 1.5rem; }
    .forms .panel + .panel { margin-top: 0; }

    h2 { margin: 0 0 1rem; font-size: 1.15rem; font-weight: 600; }

    form { display: grid; gap: .75rem; }
    label { display: grid; gap: .25rem; font-size: .875rem; font-weight: 500; color: var(--ink-soft); }
    input {
      font: inherit;
      color: var(--ink);
      padding: .6rem .75rem;
      border: 1px solid #b9c6c1;
      border-radius: 8px;
      background: #fff;
      width: 100%;
    }
    input::placeholder { color: #8a9a95; }
    input:focus-visible {
      outline: 3px solid rgba(0, 237, 100, .45);
      border-color: var(--green);
    }

    button {
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      padding: .6rem 1rem;
      transition: background-color .15s, border-color .15s;
    }
    button:focus-visible { outline: 3px solid rgba(0, 237, 100, .55); outline-offset: 2px; }
    form button {
      background: var(--green);
      color: #fff;
      border: 1px solid var(--green);
      margin-top: .25rem;
    }
    form button:hover { background: #00553c; }
    #login-form button { background: var(--ink); border-color: var(--ink); }
    #login-form button:hover { background: #07303f; }

    /* ตาราง */
    .table-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1rem; }
    .table-head h2 { margin: 0; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    th {
      text-align: left;
      font-weight: 600;
      color: var(--ink-soft);
      font-size: .85rem;
      padding: .5rem .75rem;
      border-bottom: 2px solid var(--line);
      white-space: nowrap;
    }
    td { padding: .65rem .75rem; border-bottom: 1px solid var(--line); }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #f8fbfa; }
    td:nth-child(1) { font-weight: 600; }
    td:nth-child(3) { color: var(--ink-soft); word-break: break-all; }
    td:nth-child(4) {
      font-size: .85rem;
      color: var(--green);
      font-weight: 600;
    }
    td button {
      background: #fff;
      color: var(--danger);
      border: 1px solid #f0b9b3;
      padding: .25rem .7rem;
      font-size: .85rem;
    }
    td button:hover { background: var(--danger-bg); border-color: var(--danger); }

    .empty {
      display: none;
      text-align: center;
      padding: 2rem 1rem 1rem;
      color: var(--ink-soft);
    }
    .table-wrap:has(tbody:empty) .empty { display: block; }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      header h1 { font-size: 1.6rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>ระบบสมาชิก</h1>
      <p>สมัครสมาชิก เข้าสู่ระบบ และจัดการบัญชี ข้อมูลเก็บใน MongoDB</p>
    </div>
  </header>

  <main>
    <p id="message"></p>

    <div class="layout">
      <div class="forms">
        <section class="panel">
          <h2>สมัครสมาชิก</h2>
          <form id="register-form">
            <label>Username
              <input name="username" placeholder="a-z, 0-9 หรือ _ (3–20 ตัว)" required>
            </label>
            <label>ชื่อ-นามสกุล
              <input name="name" placeholder="เช่น สมชาย ใจดี" required>
            </label>
            <label>อีเมล
              <input name="email" type="email" placeholder="name@example.com" required>
            </label>
            <label>รหัสผ่าน
              <input name="password" type="password" placeholder="อย่างน้อย 8 ตัวอักษร" minlength="8" required>
            </label>
            <button type="submit">สมัครสมาชิก</button>
          </form>
        </section>

        <section class="panel">
          <h2>เข้าสู่ระบบ</h2>
          <form id="login-form">
            <label>Username
              <input name="username" placeholder="username" required>
            </label>
            <label>รหัสผ่าน
              <input name="password" type="password" placeholder="รหัสผ่าน" required>
            </label>
            <button type="submit">เข้าสู่ระบบ</button>
          </form>
        </section>
      </div>

      <section class="panel">
        <div class="table-head">
          <h2>สมาชิกทั้งหมด</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>username</th><th>ชื่อ</th><th>อีเมล</th><th>role</th><th></th></tr>
            </thead>
            <tbody id="user-table"></tbody>
          </table>
          <p class="empty">ยังไม่มีสมาชิก กรอกฟอร์มด้านซ้ายเพื่อสมัครคนแรก</p>
        </div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
